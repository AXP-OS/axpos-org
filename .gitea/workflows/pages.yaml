# documentation:
# - https://docs.gitea.com/usage/actions/overview
# - https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows
# - https://docs.gitea.com/usage/actions/faq#what-workflow-trigger-events-does-gitea-support
############################################################################################
name: Deploy to Codeberg Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - hugo

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      forceupdate:
        description: 'Override existing device pages?'
        required: false
        default: false
        type: boolean

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
#permissions:
#  contents: read
#  pages: write
#  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
#concurrency:
#  group: "pages"
#  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: docker-node-latest
    env:
      HUGO_VERSION: 0.141.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
          apt-get update -y
          apt-get install -y imagemagick bc

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          git submodule update --remote
          ./text_convert.sh "${{ vars.AXPOS_WEB_IMPRINT }}" static/img/imp.png
          if [ "${{ inputs.forceupdate }}" == "true" ];then
            ./create_page.sh all force
          else
            ./create_page.sh all
          fi
          hugo \
            --gc \
            --minify \
            --baseURL "${{ vars.AXPOS_WEB_URL }}/"
          cp .domains public/

      - name: "Deploy into pages branch"
        uses: https://itsblue.dev/actions/codeberg-pages-deploy@v1
        with:
          token: ${{ secrets.LOCAL_TOKEN_REPO_RW }}
          username: ${{ gitea.actor }}
          git_name: ${{ gitea.actor }}
          force: false
          commit_message: "rebuild for https://code.binbash.rocks/AXP.OS/axpos-org/commit/${{ github.sha }}"
          folder: ./public

  mirror:
    needs: build
    uses: ./.gitea/workflows/mirror_releases_org.yaml
