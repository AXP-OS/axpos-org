############################################################################################
# documentation:
# - https://docs.gitea.com/usage/actions/overview
# - https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows
# - https://docs.gitea.com/usage/actions/faq#what-workflow-trigger-events-does-gitea-support
############################################################################################
name: Deploy to Codeberg Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - hugo

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild existing device page(s)?'
        required: false
        default: false
        type: boolean
      forcewhat:
        description: 'specify: <leave-emtpy> or "all" | "<device-codename> [_SPACE_ <device-codename>]"'
        required: false
        type: string
      forceimp:
        description: 'Force impressum re-write?'
        required: false
        default: true
        type: boolean


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
#permissions:
#  contents: read
#  pages: write
#  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
#concurrency:
#  group: "pages"
#  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: docker-node-latest
    env:
      HUGO_VERSION: 0.155.3
      HEXTRA_VERSION: 0.11.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
          apt-get update -y
          apt-get install -y imagemagick bc

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
        run: |
          git submodule update --remote

          cd themes/hextra/ && git fetch --tags && git checkout refs/tags/v${HEXTRA_VERSION}
          cd ../..

          if [ -z "${{ inputs.forceimp }}" ] || [ "${{ inputs.forceimp }}" == "true" ];then
            echo "convert imp.png"
            ./text_convert.sh "${{ vars.AXPOS_WEB_IMPRINT }}" static/img/imp.png
          else
            echo "skipping imp bc forceimp: ${{ inputs.forceimp }}"
          fi
          if [ "${{ inputs.force }}" == "true" ];then
            if [ -z "${{ inputs.forcewhat }}" ] || [ "${{ inputs.forcewhat }}" == "all" ];then
              ./create_page.sh all force
            else
              for p in ${{ inputs.forcewhat }};do
                ./create_page.sh device_${p}.params force
              done
            fi
          else
            ./create_page.sh all
          fi
          hugo \
            --gc \
            --minify \
            --baseURL "${{ vars.AXPOS_WEB_URL }}/"
          cp .domains public/

      - name: Push changes to main branch
        run: |
          git status
          CMT=0
          # add unstaged changes
          git add -A || CMT=1
          # check for uncommitted changes
          CMTL=$(git status --porcelain=v1 | wc -l 2>/dev/null)
          # commit if any of the above require it
          if [ $CMT -eq 1 -o $CMTL -gt 0 ];then 
            git config user.name "gitea-actions[bot]"
            git config user.email "<sherlock@binbash.rocks>"
            git commit -m "changed by hugo compile 🛠️"
            git push
            echo "pushed changes 🚀 !"
          else
            echo "nothing to commit 🥺"
          fi

      - name: "Deploy into pages branch"
        #uses: https://itsblue.dev/actions/codeberg-pages-deploy@v1
        uses: https://code.binbash.rocks/Android/codeberg-pages-deploy@v1
        with:
          token: ${{ secrets.LOCAL_TOKEN_REPO_RW }}
          username: ${{ gitea.actor }}
          git_name: "gitea-actions[bot]"
          git_email: "sherlock@binbash.rocks"
          force: true
          commit_message: "🛠️ rebuild for https://code.binbash.rocks/AXP.OS/axpos-org/commit/${{ github.sha }}"
          folder: ./public

  mirror:
    needs: build
    uses: ./.gitea/workflows/mirror-codeberg.yaml
    runs-on: docker-node-latest
    secrets: inherit
