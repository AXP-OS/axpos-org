baseURL: https://axpos.org
languageCode: en-us
title: The AXP.OS Project
theme: hextra
defaultContentLanguage: en

enableGitInfo: true
enableInlineShortcodes: true

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: Devices
      pageRef: /devices
      weight: 2
    - name: "Documentation"
      pageRef: /documentation
      weight: 3
    - name: "Sources"
      weight: 4
      url: "/docs/knowledge/faq/#is-there-a-list-where-the-source-code-is-hosted"
    - name: FAQ
      pageRef: /FAQ
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
params:

  theme:
    # light | dark | system
    default: dark
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: full
  
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: full

  displayUpdatedDate: true
  dateFormat: "2006-01-02"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /favicon.svg
      dark: /favicon-dark.svg
      link: /
      width: 40
      height: 20

  highlight:
    copy:
      enable: true
      # hover | always
      display: always

  editURL:
    enable: true
    base: "https://codeberg.org/AXP-OS_releases/axpos-org/blame/branch/hugo"

  # set global variables
  # usage:
  # {{< globalvar key="docBaseUrl" uripath="/Features" linkname="enhancements and additions" >}}
  # {{< globalvar key="about_info" format="true" >}}
  globalvars:
    docBaseUrl: "https://github.com/AXP-OS/build/wiki"
    about_info: |
      The main goal of this project is to strive for a balance between a<br/><br/>
      <b>privacy and</b><br/><b>security-oriented</b><br/>yet <b>usable</b><br/><br/>Operating System - and last but not least ... even for <i>advanced*</i> users.
      <br/><br/>
      <i>*i.e. including full control over your own device - if desired</i>
    downloadServerBaseUrl: "https://leech.binbash.rocks:8008"
  # fallback, e.g. required e.g. in "steps" shortcode
  docBaseUrl: #"https://github.com/AXP-OS/build/wiki"

markup:
  # allow raw html / used e.g. in steps
  goldmark:
    renderer:
      unsafe: true

ignoreFiles:
  - device_*params
  - create_page.sh
  - .gitea/*
