baseURL: https://axpos.org
languageCode: en-us
title: The AXP.OS Project
theme: hextra
defaultContentLanguage: en

enableGitInfo: true
enableInlineShortcodes: true

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: News
      pageRef: /news
      weight: 2
    - name: Devices
      pageRef: /devices
      weight: 3
    - name: Changelog
      pageRef: /Changelog
      weight: 4
    - name: "Documentation"
      pageRef: /documentation
      weight: 5
    - name: "Sources"
      weight: 6
      url: "/docs/knowledge/faq/#is-there-a-list-where-the-source-code-is-hosted"
    - name: Support
      pageRef: /docs/overview/#support
      weight: 7
    - name: FAQ
      pageRef: /FAQ
      weight: 8
    - name: Search
      weight: 9
      params:
        type: search
params:

  theme:
    # light | dark | system
    default: dark
    displayToggle: true
  
  page:
    width: wide

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: full
  
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  displayUpdatedDate: true
  dateFormat: "2006-01-02"

  navbar:
    width: wide
    displayTitle: true
    displayLogo: true
    logo:
      path: /favicon.svg
      dark: /favicon-dark.svg
      link: /
      width: 40
      height: 20

  highlight:
    copy:
      enable: true
      # hover | always
      display: always

  editURL:
    enable: true
    base: "https://codeberg.org/AXP-OS/axpos-org/blame/branch/hugo/content"

  # set global variables
  # usage:
  # {{< globalvar key="docBaseUrl" uripath="/Features" linkname="enhancements and additions" >}}
  # {{< globalvar key="about_info" format="true" >}}
  # {{ printf "%s" .docbaseurl }} within a partial
  globalvars:
    about_info: |
      AXP.OS is a more private and secure mobile operating system that is based on AOSP & LineageOS and has emerged from the well-known but discontinued operating system <i>DivestOS</i>.<br/>
      <br/>
      In particular AXP.OS aims to support devices that would otherwise no longer receive any (Android/Kernel) updates and are therefore easily vulnerable. All this is based on a best-effort principle, also because outdated devices no longer receive updates for proprietary firmware and are therefore insecure by definition.<br/>
      AXP.OS at least <i>tries</i> to close all <a href="/Patchlevel" target="_blank">the gaps that are possible</a>.<br/>
      <br/>
      In addition to this main goal, this project attempts to strike a balance between a<br/>
      <br/>
      <b>privacy and</b><br/><b>security-oriented</b><br/>yet <b>usable</b><br/><br/>operating system - not least for <i>advanced*</i> users.
      <br/><br/>
      <i>*i.e. including full control over your own device - if explicitly desired.<br/>
      For this reason, there are so-called [flavors](/Flavors), namely “Slim” and “Pro”, from which users can choose based on their personal requirements.</i>
      <br/><br/>
      <b>For more details checkout the<br/><a href="/docs/knowledge/features/#flavor-comparison" target="_blank">Features page</a></b>
    downloadServerBaseUrl: "https://leech.binbash.rocks:8008"

markup:
  # allow raw html / used e.g. in steps
  goldmark:
    renderer:
      unsafe: true

ignoreFiles:
  - device_*params
  - create_page.sh
  - .gitea/*
